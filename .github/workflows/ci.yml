name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race

  # Vulnerability gate (osv-scanner). The tree scans clean (pinned deps,
  # go.mod stdlib), so this is a BLOCKING gate: the scan job is in the
  # all-checks needs list. An exception must be documented + dated in
  # osv-scanner.toml before it may be moved back out.
  osv-scan:
    name: Vulnerability scan (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run osv-scanner (pinned; local parity with `make vuln-scan`)
        run: make vuln-scan

  # Non-blocking dependency-freshness report. Surfaces drift on every PR
  # without flaking the build; enforcement stays with review + the upgrade
  # cadence in docs/dependency-policy.md.
  deps-report:
    name: Dependency freshness (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Report outdated direct deps
        run: |
          {
            echo '### Outdated direct dependencies'
            echo '```'
            make deps-outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Aggregate required check: build/test + blocking vulnerability scan.
  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [build-test, osv-scan]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "build-test did not succeed"
            exit 1
          fi
          if [ "${{ needs.osv-scan.result }}" != "success" ]; then
            echo "osv-scan did not succeed"
            exit 1
          fi